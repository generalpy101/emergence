[project]
name = "emergence"
version = "0.1.0"
description = "AI-augmented startup triage pipeline: source, analyze, recommend."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "typer>=0.12",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
emergence = "emergence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emergence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
